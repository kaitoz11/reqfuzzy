name: Go
on:
  pull_request:
  push:
    branches: [main, feat/req-fuzzer]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: ["1.24.x", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test -race ./...
        env:
          GOTOOLCHAIN: local
      - run: go vet ./...
      - run: go build ./cmd/reqfuzzy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.go == 'stable'
        with:
          node-version: "24"
      - run: npm --prefix .reqfuzzy/browser install --no-audit --no-fund playwright@1.64.1
        if: matrix.go == 'stable'
      - run: node .reqfuzzy/browser/node_modules/playwright/cli.js install --with-deps chromium
        if: matrix.go == 'stable'
      - run: node scripts/flow-map-browser.mjs
        if: matrix.go == 'stable'
        env:
          REQFUZZY_BIN: ${{ github.workspace }}/reqfuzzy
