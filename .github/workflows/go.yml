name: Go
on:
  pull_request:
  push:
    branches: [main, feat/req-fuzzer]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24.x", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test -race ./...
        env:
          GOTOOLCHAIN: local
      - run: go vet ./...
      - run: go build ./cmd/reqfuzzy
